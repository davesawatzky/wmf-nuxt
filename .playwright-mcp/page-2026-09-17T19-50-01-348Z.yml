            - heading "Registering for the Winnipeg Music Festival" [level=3] [ref=e166]
            - list [ref=e167]:
              - listitem [ref=e168]: Begin registration by creating an account (account can be for an individual; a teacher for all their individual students, or for all their choirs; a parent for their family etc.)
              - listitem [ref=e169]: Only one teacher/one discipline allowed per form. Performers wanting to register in multiple disciplines and/or with multiple teachers require separate forms.
              - listitem [ref=e170]: Applications can be saved and completed/edited later before submission. Once submitted, applications can no longer be edited.
              - listitem [ref=e171]: You can view submitted entries by clicking on the 'eye' link to the left of the table.
              - listitem [ref=e172]: A copy can be printed for your records.
